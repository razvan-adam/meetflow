spring.application.name=meetflow

# Local settings (never committed); see .env.example.
spring.config.import=optional:file:.env[.properties]

# Database: the schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
# Locally, Spring Boot starts PostgreSQL from compose.yaml and connects to it automatically.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=never

# No default in-memory user with a generated password; users come from the identity module.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Session lifetime; the session cookie itself is configured in identity/SecurityConfig.
spring.session.timeout=8h

# Health check at /api/health, the only Actuator endpoint exposed
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never echo request details back in error responses
server.error.include-message=never
server.error.include-stacktrace=never
